name: IndexNow Submit

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

concurrency:
  group: indexnow-production-submit
  cancel-in-progress: false

jobs:
  guard:
    name: Check deployment eligibility
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
    steps:
      - id: guard
        name: Filter Production success
        shell: bash
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_STATE: ${{ github.event.deployment_status.state }}
        run: |
          if [[ "$DEPLOYMENT_ENVIRONMENT" != "Production" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            {
              echo "## IndexNow submission skip"
              echo "- INDEXNOW MODE: LIVE-CAPABLE"
              echo "- Reason: Preview deployment"
              echo "- INDEXNOW LIVE ENABLED: NO"
              echo "- INDEXNOW REQUEST SENT: NO"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$DEPLOYMENT_STATE" != "success" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            {
              echo "## IndexNow submission skip"
              echo "- INDEXNOW MODE: LIVE-CAPABLE"
              echo "- Reason: deployment was not successful"
              echo "- INDEXNOW LIVE ENABLED: NO"
              echo "- INDEXNOW REQUEST SENT: NO"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan IndexNow URLs
    needs: guard
    if: needs.guard.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect successful Production deployments
        uses: actions/github-script@v7
        env:
          DEPLOYMENTS_FILE: ${{ runner.temp }}/indexnow-deployments.json
        with:
          script: |
            const fs = require('node:fs');
            const maxPages = 5;
            const perPage = 100;
            const boundedPages = async (request, params) => {
              const values = [];
              for (let page = 1; page <= maxPages; page += 1) {
                const response = await request({ ...params, page, per_page: perPage });
                values.push(...response.data);
                if (response.data.length < perPage) return { values, complete: true };
              }
              return { values, complete: false };
            };
            try {
              const deploymentPage = await boundedPages(github.rest.repos.listDeployments, {
                owner: context.repo.owner, repo: context.repo.repo, environment: 'Production',
              });
              if (!deploymentPage.complete) throw new Error('deployment history exceeded 5 pages');
              const successful = [];
              for (const deployment of deploymentPage.values) {
                if (deployment.environment !== 'Production') continue;
                const statusPage = await boundedPages(github.rest.repos.listDeploymentStatuses, {
                  owner: context.repo.owner, repo: context.repo.repo, deployment_id: deployment.id,
                });
                if (!statusPage.complete) throw new Error('deployment status history exceeded 5 pages');
                const latestRelevantStatus = statusPage.values
                  .filter((status) => status.state !== 'inactive')
                  .slice()
                  .sort((left, right) => String(right.created_at).localeCompare(String(left.created_at)) || String(right.id).localeCompare(String(left.id)))[0];
                if (latestRelevantStatus?.state === 'success') {
                  successful.push({ id: String(deployment.id), sha: deployment.sha, environment: deployment.environment, state: 'success', created_at: deployment.created_at });
                }
              }
              fs.writeFileSync(process.env.DEPLOYMENTS_FILE, JSON.stringify({ complete: true, deployments: successful }));
            } catch (error) {
              fs.writeFileSync(process.env.DEPLOYMENTS_FILE, JSON.stringify({ complete: false, deployments: [], error: error.message }));
            }

      - name: Resolve deployment range
        id: range
        env:
          INDEXNOW_MODE: deployment_status
          INDEXNOW_DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          INDEXNOW_DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          INDEXNOW_DEPLOYMENTS_FILE: ${{ runner.temp }}/indexnow-deployments.json
        run: |
          set -o pipefail
          node --import tsx scripts/indexnow/resolve-deployment-range.ts > "$RUNNER_TEMP/indexnow-range.json"
          if jq -e '.shouldPlan == false' "$RUNNER_TEMP/indexnow-range.json" >/dev/null; then
            jq -r '.reason' "$RUNNER_TEMP/indexnow-range.json" > "$RUNNER_TEMP/indexnow-skip-reason.txt"
            echo "should_plan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e '.shouldPlan == true and (.baseSha|type == "string") and (.headSha|type == "string")' "$RUNNER_TEMP/indexnow-range.json" >/dev/null
          echo "should_plan=true" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r '.baseSha' "$RUNNER_TEMP/indexnow-range.json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.headSha' "$RUNNER_TEMP/indexnow-range.json")" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$(jq -r '.currentDeploymentId // \"\"' "$RUNNER_TEMP/indexnow-range.json")" >> "$GITHUB_OUTPUT"

      - name: Report range skip
        if: steps.range.outputs.should_plan != 'true'
        run: |
          {
            echo "## IndexNow submission skip"
            echo "- INDEXNOW MODE: LIVE-CAPABLE"
            echo "- Event: deployment_status"
            echo "- Deployment ID: ${{ github.event.deployment.id }}"
            echo "- Reason: $(cat "$RUNNER_TEMP/indexnow-skip-reason.txt" 2>/dev/null || echo 'range resolution failed safely')"
            echo "- INDEXNOW LIVE ENABLED: $([[ '${{ vars.INDEXNOW_LIVE_ENABLED }}' == 'true' ]] && echo YES || echo NO)"
            echo "- INDEXNOW REQUEST SENT: NO"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run existing IndexNow planner
        if: steps.range.outputs.should_plan == 'true'
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
        run: |
          npm run indexnow:plan -- --base "$BASE_SHA" --head "$HEAD_SHA" --json > "$RUNNER_TEMP/indexnow-plan-raw.txt"
          node --input-type=module -e '
            import fs from "node:fs";
            const raw = fs.readFileSync(process.env.RUNNER_TEMP + "/indexnow-plan-raw.txt", "utf8");
            const start = raw.indexOf("{");
            if (start < 0) throw new Error("Planner did not produce JSON");
            const plan = JSON.parse(raw.slice(start));
            if (!Array.isArray(plan.urls) || plan.urls.length > 500) throw new Error("Planner exceeded the 500 URL safety ceiling");
            fs.writeFileSync(process.env.RUNNER_TEMP + "/indexnow-plan.json", JSON.stringify(plan, null, 2));
          '

      - name: Write IndexNow summary
        if: steps.range.outputs.should_plan == 'true'
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
          LIVE_ENABLED: ${{ vars.INDEXNOW_LIVE_ENABLED }}
        run: |
          live="NO"; [[ "$LIVE_ENABLED" == "true" ]] && live="YES"
          {
            echo "## IndexNow submission plan"
            echo "- INDEXNOW MODE: LIVE-CAPABLE"
            echo "- Event: deployment_status"
            echo "- Deployment ID: ${{ steps.range.outputs.deployment_id }}"
            echo "- Base SHA: $BASE_SHA"
            echo "- Head SHA: $HEAD_SHA"
            echo "- Added published: $(jq '.changes.addedPublished | length' "$RUNNER_TEMP/indexnow-plan.json")"
            echo "- Updated published: $(jq '.changes.updatedPublished | length' "$RUNNER_TEMP/indexnow-plan.json")"
            echo "- Removed published: $(jq '.changes.removedPublished | length' "$RUNNER_TEMP/indexnow-plan.json")"
            echo "- Impacted URLs: $(jq '.urls | length' "$RUNNER_TEMP/indexnow-plan.json")"
            echo "- INDEXNOW LIVE ENABLED: $live"
            echo "- INDEXNOW REQUEST SENT: NO"
            if [[ "$(jq '.urls | length' "$RUNNER_TEMP/indexnow-plan.json")" == "0" ]]; then echo "- Reason: zero impacted URLs"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit IndexNow notification
        if: steps.range.outputs.should_plan == 'true' && vars.INDEXNOW_LIVE_ENABLED == 'true'
        env:
          INDEXNOW_LIVE_ENABLED: ${{ vars.INDEXNOW_LIVE_ENABLED }}
          INDEXNOW_PLAN_FILE: ${{ runner.temp }}/indexnow-plan.json
          INDEXNOW_KEY_FILE: public/09e9b751c2114051929e5edd6b639333.txt
        run: |
          node --import tsx --input-type=module -e '
            import fs from "node:fs";
            import { submitIndexNow } from "./scripts/indexnow/submit.ts";
            const plan = JSON.parse(fs.readFileSync(process.env.INDEXNOW_PLAN_FILE, "utf8"));
            const result = await submitIndexNow({ urls: plan.urls, liveEnabled: process.env.INDEXNOW_LIVE_ENABLED, keyFilePath: process.env.INDEXNOW_KEY_FILE });
            const summary = [`- INDEXNOW REQUEST SENT: ${result.sent ? "YES" : "NO"}`];
            if (result.status) summary.push(`- HTTP STATUS: ${result.status}`);
            summary.push(`- ATTEMPTS: ${result.attempts}`);
            if (result.reason) summary.push(`- Reason: ${result.reason}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join("\n") + "\n");
            if (!result.sent && plan.urls.length > 0) process.exit(1);
          '
